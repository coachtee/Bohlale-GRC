{% extends "base.html" %}
{% block title %}New document — Bohlale GRC{% endblock %}
{% block content %}
<div class="page-header"><div><h1>Create document</h1></div></div>
<div class="card">
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
      <div class="form-row">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}<div class="form-errors">{{ field.errors }}</div>{% endif %}
      </div>
    {% endfor %}
    <div class="form-actions">
      <button class="btn btn-primary" type="submit">Save as draft</button>
      <a class="btn btn-secondary" href="{% url 'documents:list' %}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
